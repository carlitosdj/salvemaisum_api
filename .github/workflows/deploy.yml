name: Deploy Salve mais um

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          port: ${{ secrets.REMOTE_PORT }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== [1/3] Atualizando código ==="
            if [ ! -d "/www/wwwroot/nodeapps/api_salvemaisum/.git" ]; then
              git clone https://github.com/carlitosdj/salvemaisum_api.git /www/wwwroot/nodeapps/api_salvemaisum
            fi
            cd /www/wwwroot/nodeapps/api_salvemaisum
            git pull origin main

            echo "=== [2/3] Criando ormconfig.json ==="
            cat > /www/wwwroot/nodeapps/api_salvemaisum/ormconfig.json << 'ORMEOF'
            {
              "type": "mysql",
              "host": "129.121.33.154",
              "port": 3306,
              "username": "salvemaisum_admin",
              "password": "carlosdj123",
              "database": "salvemaisum_database",
              "synchronize": true,
              "logging": false,
              "entities": ["build/entity/**/*.js"],
              "migrations": ["build/migration/**/*.js"],
              "subscribers": ["build/subscriber/**/*.js"]
            }
            ORMEOF

            echo "=== [3/3] Rebuild + deploy API ==="
            cd /www/wwwroot/nodeapps/bin_salvemaisum
            ./deploy.sh prod rebuild app

            echo "=== Status final ==="
            ./deploy.sh prod ps
